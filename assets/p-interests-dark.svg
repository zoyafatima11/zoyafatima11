<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="586" viewBox="0 0 1200 586" role="img" aria-labelledby="t d">
  <title id="t">Research interests (page 3 of 7)</title>
  <desc id="d">Attention diagram linking: research, statistics, learning, attention, diffusion, retrieval, agents, alignment. Her questions sit where how models learn meets what they make: why attention works, how diffusion turns noise into structure, and how to tell when a generative model is right rather than merely fluent.</desc>
